default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [imports, default<%= ", canonical_catalog" if ENV["MUZEUM_CATALOG_WORKER"] == "1" %>]
      threads: <%= ENV.fetch("JOB_THREADS", 1) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
