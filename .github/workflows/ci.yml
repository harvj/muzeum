name: CI
on:
  pull_request:
  push:
    branches: [main, 'release/v*', candidate/v0.3.4-shell, candidate/v0.3.4-shell-revocation, codex/v072-shell-adoption]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muzeum_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/muzeum_test
      BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rails db:prepare
      - name: Replay migrations in a separate disposable database
        run: bundle exec rails db:create db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/muzeum_migration_test
          SCHEMA: tmp/migration-structure.sql
      - run: bundle exec rspec
      - name: Verify backup helper tests
        run: python3 -m unittest discover -s ops/backups -p 'test_*.py'
      - name: Verify catalog readiness diagnostics
        run: python3 -m unittest discover -s ops/catalog -p 'test_*.py'
      - name: Install disposable recovery-test dependency
        run: sudo apt-get update && sudo apt-get install -y restic postgresql-client-16
      - name: Rehearse Muzeum deploy success and failure paths in disposable databases
        run: python3 -m unittest discover -s ops/deploy -p 'test_*.py' -v
        env:
          MUZEUM_DEPLOY_TEST_PGPORT: '5432'
          MUZEUM_DEPLOY_TEST_PGBIN: /usr/lib/postgresql/16/bin
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: bundle exec rails zeitwerk:check
      - name: Compile production assets
        run: bundle exec rails assets:precompile
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
      - name: Validate Capistrano configuration without contacting the server
        run: bundle exec cap production -T
      - name: Fetch the reviewed Infrastructure verifier
        if: github.event_name == 'push' && (github.ref_name == 'codex/v072-shell-adoption' || startsWith(github.ref_name, 'release/v'))
        env:
          INFRASTRUCTURE_READ_KEY: ${{ secrets.INFRASTRUCTURE_STANDARDS_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/shell-infrastructure"
          credentials="$(mktemp -d)"
          trap 'rm -rf "$credentials"' EXIT
          install -m 600 /dev/null "$credentials/key"
          printf '%s\n' "$INFRASTRUCTURE_READ_KEY" > "$credentials/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$credentials/known_hosts"
          git init "$verifier"
          export GIT_SSH_COMMAND="ssh -i $credentials/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$credentials/known_hosts -o BatchMode=yes"
          git -C "$verifier" fetch --depth 1 git@github.com:harvj/infrastructure.git a1a4fb8ca40869f77e60bbe8d830e256fde3acfd
          git -C "$verifier" checkout --detach FETCH_HEAD
      - name: Collect signed Shell v2 evidence for this commit
        if: github.event_name == 'push' && (github.ref_name == 'codex/v072-shell-adoption' || startsWith(github.ref_name, 'release/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          SHELL_SELECTED: ${{ vars.MUZEUM_SHELL_SELECTED_VERSION }}
          SHELL_ADOPTED: ${{ vars.MUZEUM_SHELL_ADOPTED_VERSION }}
        run: |
          test -n "$SHELL_SELECTED" && test -n "$SHELL_ADOPTED" || exit 1
          export APPLICATION_SHELL_VERIFIER="$RUNNER_TEMP/shell-infrastructure"
          "$APPLICATION_SHELL_VERIFIER/bin/application-shell-ci" \
            --app muzeum --revision "$GITHUB_SHA" --checkout "$GITHUB_WORKSPACE" \
            --version "$SHELL_SELECTED" --adopted-version "$SHELL_ADOPTED" \
            --adapter "$GITHUB_WORKSPACE/config/application_shell/ci-adapter.json" \
            --output "$RUNNER_TEMP/muzeum-shell-evidence" --mode audit
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && (github.ref_name == 'codex/v072-shell-adoption' || startsWith(github.ref_name, 'release/v'))
        with:
          name: muzeum-shell-${{ github.sha }}
          path: |
            ${{ runner.temp }}/muzeum-shell-evidence/*.json
            tmp/application-shell-sh08-source.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-failures
          path: tmp/screenshots
          if-no-files-found: ignore
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - bin/rubocop
          - bin/brakeman --no-pager --exit-on-warn --exit-on-error
          - bin/bundler-audit check --update
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ${{ matrix.command }}
