name: CI
on:
  pull_request:
  push:
    branches: [main, release/v0.3.2, rollback/v0.3.3-ruby-3.4.13]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muzeum_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/muzeum_test
      BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rails db:prepare
      - name: Replay migrations in a separate disposable database
        run: bundle exec rails db:create db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/muzeum_migration_test
          SCHEMA: tmp/migration-structure.sql
      - run: bundle exec rspec
      - name: Verify backup helper tests
        run: python3 -m unittest discover -s ops/backups -p 'test_*.py'
      - name: Verify catalog readiness diagnostics
        run: python3 -m unittest discover -s ops/catalog -p 'test_*.py'
      - name: Install disposable recovery-test dependency
        run: sudo apt-get update && sudo apt-get install -y restic postgresql-client-16
      - name: Rehearse Muzeum deploy success and failure paths in disposable databases
        run: python3 -m unittest discover -s ops/deploy -p 'test_*.py' -v
        env:
          MUZEUM_DEPLOY_TEST_PGPORT: '5432'
          MUZEUM_DEPLOY_TEST_PGBIN: /usr/lib/postgresql/16/bin
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: bundle exec rails zeitwerk:check
      - name: Compile production assets
        run: bundle exec rails assets:precompile
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
      - name: Validate Capistrano configuration without contacting the server
        run: bundle exec cap production -T
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-failures
          path: tmp/screenshots
          if-no-files-found: ignore
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - bin/rubocop
          - bin/brakeman --no-pager --exit-on-warn --exit-on-error
          - bin/bundler-audit check --update
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ${{ matrix.command }}
