name: CI
on:
  pull_request:
  push:
    branches: [main, release/v0.3.2, controls/v0.3.4]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muzeum_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/muzeum_test
      BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Verify Muzeum runtime selection
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin muzeum
          sudo env MUZEUM_RUNTIME_TEST_USER=muzeum python3 -B -m unittest discover -s ops/runtime -p 'test_*.py'
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rails db:prepare
      - name: Replay migrations in a separate disposable database
        run: bundle exec rails db:create db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/muzeum_migration_test
          SCHEMA: tmp/migration-structure.sql
      - run: bundle exec rspec
      - name: Verify backup helper tests
        run: python3 -m unittest discover -s ops/backups -p 'test_*.py'
      - name: Verify catalog readiness diagnostics
        run: python3 -m unittest discover -s ops/catalog -p 'test_*.py'
      - name: Install disposable recovery-test dependency
        run: sudo apt-get update && sudo apt-get install -y restic postgresql-client-16
      - name: Rehearse Muzeum deploy success and failure paths in disposable databases
        run: python3 -m unittest discover -s ops/deploy -p 'test_*.py' -v
        env:
          MUZEUM_DEPLOY_TEST_PGPORT: '5432'
          MUZEUM_DEPLOY_TEST_PGBIN: /usr/lib/postgresql/16/bin
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: bundle exec rails zeitwerk:check
      - name: Compile production assets
        run: bundle exec rails assets:precompile
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
      - name: Validate Capistrano configuration without contacting the server
        run: bundle exec cap production -T
      - name: Check Application Shell tooling access
        if: ${{ !cancelled() }}
        id: shell-tooling
        env:
          STANDARDS_KEY: ${{ secrets.INFRASTRUCTURE_STANDARDS_SSH_KEY }}
        run: |
          if [[ -n "$STANDARDS_KEY" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '### Application Shell audit unavailable' >> "$GITHUB_STEP_SUMMARY"
            echo 'Configure an approved read-only Infrastructure credential to run the pilot.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out reviewed Infrastructure standards
        if: ${{ !cancelled() && steps.shell-tooling.outputs.available == 'true' }}
        id: shell-checkout
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: harvj/infrastructure
          ref: 0588826061ff0f7f16916beab763b484af06e514
          path: .standards/infrastructure
          ssh-key: ${{ secrets.INFRASTRUCTURE_STANDARDS_SSH_KEY }}
          ssh-strict: true
          sparse-checkout: |
            .github/actions/application-shell-ci
            bin
            deploy/keys
            lib
          persist-credentials: false
      - name: Report unavailable Application Shell contract
        if: ${{ !cancelled() && steps.shell-checkout.outcome == 'failure' }}
        run: echo 'Application Shell audit could not retrieve the pinned Infrastructure revision.' >> "$GITHUB_STEP_SUMMARY"
      - name: Audit the current Application Shell in ordinary CI
        if: ${{ !cancelled() && steps.shell-checkout.outcome == 'success' }}
        uses: ./.standards/infrastructure/.github/actions/application-shell-ci
        with:
          application: muzeum
          revision: ${{ github.sha }}
          adapter: .github/application-shell-checks.json
          mode: audit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-failures
          path: tmp/screenshots
          if-no-files-found: ignore
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - bin/rubocop
          - bin/brakeman --no-pager --exit-on-warn --exit-on-error
          - bin/bundler-audit check --update
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ${{ matrix.command }}
