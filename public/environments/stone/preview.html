<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muzeum stone environment</title><link rel="stylesheet" href="environment.css"><style>body{margin:0;isolation:isolate}.stone-environment{z-index:-1}form{position:fixed;bottom:24px;left:24px;display:flex;gap:12px;align-items:center;background:#fff;color:#242825;padding:12px 16px;border-radius:8px;font:14px system-ui}button,select{font:inherit}html[data-recording=true] form{display:none}</style></head><body><div class="stone-environment" aria-hidden="true"></div><form><label>Stone <select name="mode"><option value="light">Limestone</option><option value="dark">Onyx</option></select></label><button type="button" id="pause" aria-pressed="false">Pause light</button></form><script>
const params=new URLSearchParams(location.search);document.documentElement.dataset.appearance=params.get('mode')==='dark'?'dark':'light';document.querySelector('select').value=document.documentElement.dataset.appearance;document.documentElement.dataset.recording=params.get('recording')==='1';document.querySelector('select').onchange=e=>document.documentElement.dataset.appearance=e.target.value;document.querySelector('#pause').onclick=e=>{const paused=document.documentElement.dataset.still!=='true';document.documentElement.dataset.still=String(paused);e.target.setAttribute('aria-pressed',String(paused));e.target.textContent=paused?'Resume light':'Pause light'};document.addEventListener('visibilitychange',()=>document.documentElement.dataset.still=String(document.hidden));
</script></body></html>
